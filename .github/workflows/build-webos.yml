name: Build Opus 7.1 Test (webOS)

on:
  push:
    # Don't run for tags
    tags-ignore:
      - 'v*.*.*'
    branches:
      - 'codex/opus71-c5-test'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Streaming builds must not enable LC_DEBUG's synthetic FEC recovery checks.
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Branches of this repository are already built by the push trigger,
    # so only build pull requests opened from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Set Short Commit ID
        shell: bash
        run: echo SHORT_SHA="${HEAD_SHA:0:8}" >> $GITHUB_ENV
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download ares-cli-rs
        uses: robinraju/release-downloader@v1.9
        with:
          repository: "webosbrew/ares-cli-rs"
          latest: true
          fileName: "ares-package_*_amd64.deb"
          out-file-path: "temp"

      - name: Download Homebrew Toolbox
        uses: robinraju/release-downloader@v1.9
        with:
          repository: "webosbrew/dev-toolbox-cli"
          latest: true
          fileName: "webosbrew-toolbox-*_amd64.deb"
          out-file-path: "temp"

      - name: Update Packages
        run: sudo apt-get -yq update

      - name: Install Tools
        run: sudo apt-get install ./temp/*.deb

      - name: Install contract test dependencies
        run: sudo apt-get install -y libgstreamer1.0-dev libopus-dev libjson-c5

      - name: Check stream diagnostics
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/test_stream_diagnostics.c -Isrc/app/stream/connection -o /tmp/moonlight-stream-diagnostics
          /tmp/moonlight-stream-diagnostics

      - name: webOS Build
        uses: ./.github/actions/build-webos
        with:
          build-type: ${{ env.BUILD_TYPE }}

      - name: Record source and binary identities
        run: |
          python3 scripts/webos/verify_optimized_package.py
          python3 scripts/webos/opus71_provenance.py

      - name: Add Commit Hash Suffix
        shell: bash
        working-directory: dist
        run: for file in *.ipk ; do mv $file ${file//_arm/-${SHORT_SHA}_arm} ; done

      - uses: actions/upload-artifact@v4
        with:
          name: webos-snapshot-${{ env.SHORT_SHA }}
          path: |
            dist/*.ipk
            dist/opus71-build-provenance.json

      - name: Compatibility Check
        run: webosbrew-ipk-verify -f markdown -d -o $GITHUB_STEP_SUMMARY dist/*.ipk
